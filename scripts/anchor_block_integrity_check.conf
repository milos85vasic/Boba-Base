# anchor_block_integrity_check.conf — boba's mirror-set + regex bindings.
#
# Consumed by scripts/anchor_block_integrity_check.sh per §11.4.35
# "consumer supplies data" — never hardcoded in the checker.
#
# The mirror set is the §11.4.157 lockstep quartet (CLAUDE.md,
# AGENTS.md, QWEN.md, GEMINI.md). Constitution.md is the CANONICAL
# variant explicitly excluded from mirror-lockstep equality per
# §11.4.227(B) canonical-vs-mirror layer variance.

# Path from which MIRROR_SET / CANONICAL_FILE are resolved. Relative
# paths are resolved from THIS CONFIG FILE's directory.
BASE_DIR="../constitution"

# Four-mirror lockstep set (byte-identical content required per anchor).
MIRROR_SET=(
  "CLAUDE.md"
  "AGENTS.md"
  "QWEN.md"
  "GEMINI.md"
)

# Canonical file — carries the ### heading variant; excluded from
# lockstep-hash comparison, still checked for exactly-once + zero-block
# guards.
CANONICAL_FILE="Constitution.md"

# Block-start regex (ERE). Matches either the canonical `### §11.4.NNN`
# markdown heading or the mirror's inline `**§11.4.NNN` paragraph
# lead-in. Both are known-present in the boba constitution mirrors.
BLOCK_START_RE='^(#{2,4} §11[.]4[.][0-9]+([.][A-Za-z0-9]+)?|[*][*]§11[.]4[.][0-9]+([.][A-Za-z0-9]+)?)'

# Anchor-id extractor (ERE). Captures the full dotted anchor id, so
# §11.4.10.A never prefix-matches §11.4.10. Parenthesised sub-suffixes
# like §11.4.115(F) are mid-body citations by construction — the
# BLOCK_START_RE never accepts them, so no additional guard is needed.
ANCHOR_ID_RE='§11[.]4[.][0-9]+([.][A-Za-z0-9]+)?'
