# constitution-sweep.conf — CONSUMER DATA for scripts/verify-all-constitution-rules.sh
#
# §11.4.35 / §11.4.28(B) / §11.4.177: the constitution submodule owns ALL gate
# CODE; this file owns only boba's DATA — which constitution gate takes which
# argument, and which gate is genuinely not applicable here (with its reason).
# Adding a gate to the constitution requires NO edit here: the sweep discovers
# every `constitution/scripts/gates/cm_*.sh` mechanically and applies the
# DEFAULT argument row below unless a gate-specific row overrides it.
#
# Format (tab-separated), one directive per line:
#   ARGS   <gate-script-basename>   <args...>     # argv passed to that gate
#   SKIP   <gate-script-basename>   <reason>      # declared not-applicable
#   DEFAULT                          <args...>    # argv for every other gate
#
# @ROOT@ expands to boba's repository root (absolute).
# A SKIP reason MUST come from the §11.4.69 closed set:
#   geo_restricted | operator_attended | hardware_not_present |
#   topology_unsupported | network_unreachable_external |
#   feature_disabled_by_config | artifact_not_yet_built
#
# NOTE (§11.4.6, honest): a SKIP row silences a gate. Every row below states a
# real, checkable reason; none is "it was red and we wanted green". Gates that
# FAIL against boba today are deliberately NOT listed here — their failures are
# the deliverable.

# ── Default: the overwhelming majority of constitution gates scan a root ──────
DEFAULT	--root	@ROOT@

# ── Gates whose argv differs (the constitution's own documented interface) ────
ARGS	cm_multitrack_engine_in_constitution.sh	--engine-dir	@ROOT@/constitution/scripts/multitrack
ARGS	cm_oracle_strategy_named_and_independent.sh	--root	@ROOT@	--glob	*test*.py
ARGS	cm_test_mock_pid_explicit_int.sh	--root	@ROOT@	--glob	*test*.py

# ── Gates requiring a consumer config file boba has not authored yet ──────────
# These two read a consumer-supplied config (CM_BUILD_PROVEN_CONFIG /
# CM_VERSION_DEPLOY_CONFIG). boba has not authored one, so the gate's
# precondition artifact does not exist yet — an honest §11.4.69
# `artifact_not_yet_built` SKIP, NOT a pass. Authoring them is tracked work.
SKIP	cm_build_on_source_proven_not_test_side.sh	artifact_not_yet_built
SKIP	cm_version_increment_on_deploy.sh	artifact_not_yet_built

# ── Gates that audit the CONSTITUTION's OWN machinery, not boba's tree ────────
# Each already defaults to its correct sibling path inside the submodule; they
# reject --root (exit 2). `-` = invoke with no arguments. Surfaced by the first
# real sweep run, which reported all four as ERROR rather than hiding them.
ARGS	cm_feature_directive.sh	-
ARGS	cm_reporting_directives.sh	-
ARGS	cm_subsystem_shortcuts.sh	-
ARGS	cm_track_branch_label.sh	-
# Audits the constitution submodule's gate ledger, so its root is the SUBMODULE
# root — boba's repo root has no Constitution.md (§11.4.35 pointer inheritance).
ARGS	cm_gate_ledger_ratchet.sh	--root	@ROOT@/constitution
