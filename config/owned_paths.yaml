# ============================================================================
# config/owned_paths.yaml — the locations that MUST end up owned by the
# operator who starts the system (feature 002-user-owned-downloads).
# ============================================================================
#
# Consumed by:
#   scripts/ownership_precondition.sh   (FR-010 — refuse to start if a location
#                                        cannot produce operator-owned files)
#   scripts/ownership_repair.sh         (FR-004  — repair pre-existing content)
#   scripts/pre_build/check_cm_ownership_invariants.sh (FR-011 — regression gate)
#
# ── WHY THIS IS DECLARED AND NOT DERIVED (T002, §11.4.6 / §11.4.201(1)) ─────
#
# These services run `network_mode: host`, so docker-compose.yml carries NO
# `ports:` mapping and no volume-derived scope to read. The only path-ish and
# port-ish values in a service block are environment variables, and those mix
# two meanings that NO syntactic rule separates:
#
#     PROXY_PORT=7186          <- a port this service SERVES
#     MERGE_SERVICE_PORT=7187  <- a port this service SERVES
#     QBITTORRENT_PORT=7185    <- a port this service CONNECTS TO
#
# The same ambiguity applies to paths: the download root comes from
# QBITTORRENT_DATA_DIR and is host-specific, while `config/` is repo-relative.
# A gate that swept the environment would demand operator ownership of things
# the system does not own — a FALSE-POSITIVE REFUSAL, which §11.4.201(1)
# forbids exactly as firmly as a false pass.
#
# THIS TRAP IS NOT HYPOTHETICAL. Its sibling file `config/served_ports.yaml`
# was first seeded from CLAUDE.md prose rather than from the Dockerfile, and
# the healthcheck gate built on it then FAILED a service whose healthcheck was
# already correct (BOB-138/BOB-141). Every entry below is therefore derived
# from MEASUREMENT on the running system, not from documentation.
#
# ── PROVENANCE (measured 2026-08-21, research.md R6) ────────────────────────
#
#   download root  : owned by uid 100999, renders as UNKNOWN:UNKNOWN
#                    6458 items at uid 1000, 1 at 100999
#   config/        : 51 items at uid 100999
#   config/boba.db : mode 600, owner does not resolve -> the operator cannot
#                    read their own credential database, so the backup that
#                    docs/BOBA_DATABASE.md §3 MANDATES is impossible to perform
#   tmp/           : already uid 1000 — nothing to REPAIR. Listed anyway; see
#                    "CURRENT STATE IS NOT SCOPE" below.
#   download-proxy/: already uid 1000 — nothing to REPAIR. Listed anyway.
#   .env           : already uid 1000, mode 600 — nothing to REPAIR. Listed anyway.
#
# ── CURRENT STATE IS NOT SCOPE (corrected 2026-08-21) ──────────────────────
#
# An earlier revision of this file omitted tmp/ with the reason "already uid
# 1000 — NOT listed, nothing to fix". That answers the REPAIR-BACKLOG question
# ("is it wrongly owned today?") and mistakes it for the SCOPE question ("can it
# ever become wrongly owned, and would we notice?"). They are different
# questions with different consequences: an undeclared location is invisible to
# the precondition (never probed), invisible to the repair (never walked) and
# invisible to the gate (never reported) — so a future wrongly-owned write there
# is silent, which is exactly the §11.4.201(6) false-null this file's own
# "ADDING AN ENTRY" note forbids.
#
# The three entries below are therefore declared on the basis of WHO WRITES
# THEM, measured from docker-compose.yml, not on the basis of what they happen
# to be owned by today. FR-012's scope is ALL container-written paths.
#
# Machine-checked: tests/unit/test_ownership_repair.sh Case 10 derives the set
# of read-WRITE bind-mount sources from docker-compose.yml and FAILS if any of
# them is neither declared here nor covered by a declared ancestor. Read-only
# (`:ro`) mounts are excluded by construction — a container cannot write through
# them. That check is what makes this list mechanically complete rather than
# maintained by memory (§11.4.238 — the automated check must be the discoverer).
#
# ── ADDING AN ENTRY ────────────────────────────────────────────────────────
#
# A location the system writes but that is absent here is UNDECLARED, and the
# gate reports it rather than silently passing — silence is not an exemption
# (§11.4.201(6)). Adding an entry changes the scope fingerprint, which re-arms
# the repair so the newly-declared path is actually repaired (data-model E2).
# ============================================================================

schema_version: 1

paths:
  # The download tree. Path comes from QBITTORRENT_DATA_DIR (see .env); the
  # value below is the documented default and is overridden at runtime by the
  # resolver in scripts/lib/ownership.sh — it is NOT hardcoded here, because a
  # hardcoded host path is exactly the project-literal coupling §11.4.35
  # forbids in shared logic.
  - path: "${QBITTORRENT_DATA_DIR:-/mnt/DATA}"
    kind: downloads
    optional: false
    preserve_mode: false
    recursive: true

  # The project configuration tree. In scope per FR-012: 51 items here were
  # owned by the mapped identity, so the operator could not edit their own
  # configuration.
  - path: "config"
    kind: project-config
    optional: false
    preserve_mode: false
    recursive: true

  # The encrypted credential store. preserve_mode is TRUE and load-bearing:
  # FR-015 forbids the repair from relaxing access while changing ownership.
  # Bringing a credential store under the operator's ownership while widening
  # who can read it would trade a usability defect for a security one — a
  # strictly worse outcome. It must remain no more permissive than mode 600.
  #
  # Listed explicitly even though `config/` above covers it recursively,
  # because its preserve_mode differs from its parent's and the more specific
  # entry must win.
  - path: "config/boba.db"
    kind: credential-store
    optional: true          # absent before first boot; absence is not an error
    preserve_mode: true
    recursive: false

  # The shared scratch tree. Mounted READ-WRITE as /shared-tmp by THREE services
  # (qbittorrent, qbittorrent-proxy-go, download-proxy — docker-compose.yml
  # lines 50, 168, 250), so all three can create content here.
  #
  # optional: false because tmp/ is present in every clone — tmp/README.md is
  # tracked, so the directory cannot be missing from a checkout — AND because
  # all three services bind-mount it: a genuinely missing tmp/ is a broken
  # precondition for the stack, not a false alarm. Refusing on it is asserting
  # the real condition, not a proxy for one (§11.4.201(1)).
  - path: "tmp"
    kind: shared-scratch
    optional: false
    preserve_mode: false
    recursive: true

  # The bind-mounted Python source tree (docker-compose.yml line 249,
  # ./download-proxy:/config/download-proxy — READ-WRITE, no :ro). The container
  # writes __pycache__/ directories into it as container root; CLAUDE.md's
  # restart contract depends on this mount being live and writable from both
  # sides ("edits to download-proxy/src/ are live; just clear __pycache__").
  #
  # Content written here by a container that the operator cannot then delete or
  # replace is the same defect class as the download tree — with the extra edge
  # that this is a git-TRACKED source tree, so a wrongly-owned artifact inside
  # it also breaks the operator's ability to clean their own working copy.
  - path: "download-proxy"
    kind: source-tree
    optional: false
    preserve_mode: false
    recursive: true

  # The environment file. Mounted READ-WRITE into boba-jackett at
  # /host-env/.env (docker-compose.yml line 309 — note the deliberate ABSENCE
  # of :ro, because the container really does write it), and
  # bootstrap.EnsureMasterKey PERSISTS BOBA_MASTER_KEY into it via
  # envfile.Atomic — a tmp+fsync+rename that REPLACES THE INODE. The file the
  # operator ends up owning is therefore one the container created, which is
  # precisely the condition this feature exists to keep operator-owned.
  #
  # Losing read access to this file is strictly worse than losing it on
  # config/boba.db: .env holds BOBA_MASTER_KEY, and docs/BOBA_DATABASE.md
  # states that losing the key makes every stored credential unrecoverable.
  #
  # preserve_mode is TRUE and load-bearing, exactly as for config/boba.db:
  # .env is mode 600 per §11.4.10 and the repair MUST NOT widen it. This
  # composes with (does not duplicate) start.sh, which forces .env to 0600 in
  # ensure_boba_master_key and asserts the mode of config/boba.db in
  # assert_credential_store_mode: start.sh SETS the floor, this entry stops the
  # repair from moving it. Nothing here reads, prints or logs any value from
  # this file — only its path, owner and mode are ever handled (§11.4.10).
  #
  # optional: true — .env is gitignored and legitimately absent before setup.sh
  # has ever run, and absence is not an error (the config/boba.db precedent).
  - path: ".env"
    kind: credential-store
    optional: true
    preserve_mode: true
    recursive: false
