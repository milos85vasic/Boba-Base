# lan_route_auth_policy.yaml — CM-LAN-ROUTES-AUTHENTICATED policy + exemption list.
#
# WHY THIS FILE EXISTS
#   On 2026-08-26 the operator decided BOB-102 as "Keep 0.0.0.0 + auth guard":
#   the tunnel stays LAN-reachable, and that exposure was accepted ON THE
#   CONDITION that a permanent guard fails the build if any LAN-reachable
#   route ever stops demanding authentication. This file is the checked-in
#   DATA half of that guard (§11.4.35); the gate is
#   scripts/pre_build/check_cm_lan_routes_authenticated.sh.
#
# HOW TO READ IT
#   `services` declares which listeners are LAN-bound and how to resolve their
#   routes and auth wiring. `exemptions` lists every route that is NOT
#   auth-wired but is nonetheless allowed to ship, one entry per route, each
#   with a mandatory `class` and a mandatory non-empty `justification` — the
#   gate refuses an entry that lacks either, so an exemption can never be
#   silent (§11.4.201(1)).
#
#   class: public-by-design  the route is genuinely meant to be open.
#   class: known-gap         the route is a REAL hole carried honestly.
#                            Not "fine" — visible, counted on every run, and
#                            expected to shrink, never grow (§11.4.261).
#
# ADDING A ROUTE
#   A new route is in neither the auth-wired set nor this list, so it FAILS
#   until somebody consciously protects it or justifies exempting it. That
#   refusal is the point: it is what stops silent drift.
#
# BIND EVIDENCE (measured 2026-08-26, cited so `lan_bound` is never a guess)
#   merge-service-python  download-proxy/src/main.py:418 MERGE_SERVICE_HOST
#                         defaults to "0.0.0.0"; docker-compose.yml:127 sets
#                         MERGE_SERVICE_HOST=0.0.0.0 explicitly.
#   qbittorrent-proxy-go  qBitTorrent-go/cmd/qbittorrent-proxy/main.go:119-121
#                         binds addr=":<port>" — a bare ":port" in Go listens
#                         on ALL interfaces.
#   boba-jackett          qBitTorrent-go/cmd/boba-jackett/main.go:211
#                         Addr: ":" + port — likewise all interfaces.
#
# HONEST BOUNDARY (§11.4.6)
#   This gate asserts STATIC ROUTE WIRING: that each LAN-reachable route is
#   attached to an auth mechanism. It does NOT assert that the mechanism is
#   armed at runtime — merge-service auth is env-gated on BOBA_API_TOKEN and
#   is OPEN when that variable is unset. That is a boot-time invariant
#   (§11.4.254), not a static one, and belongs to a separate runtime check.
#   Claiming otherwise here would be the bluff this guard exists to prevent.

schema_version: 1

services:
  - id: merge-service-python
    kind: fastapi
    lan_bound: true
    roots: ["download-proxy/src/api"]
    auth_markers: ["require_api_token"]

  - id: qbittorrent-proxy-go
    kind: gin
    lan_bound: true
    roots: ["qBitTorrent-go/cmd/qbittorrent-proxy"]
    auth_markers: []

  - id: boba-jackett
    kind: gomux
    lan_bound: true
    roots: ["qBitTorrent-go/internal/jackettapi"]
    auth_markers: ["WithAuth"]

exemptions:
  - service: merge-service-python
    method: GET
    path: "/"
    class: public-by-design
    justification: "Dashboard SPA shell. Serves static markup only; no state read or written."
    evidence: "download-proxy/src/api/__init__.py:381"
  - service: merge-service-python
    method: POST
    path: "/api/v1/auth/nnmclub/login"
    class: known-gap
    justification: "KNOWN GAP: accepts tracker credentials and mutates server-side session state. Unauthenticated on a LAN bind."
    evidence: "download-proxy/src/api/auth.py:408"
  - service: merge-service-python
    method: GET
    path: "/api/v1/auth/nnmclub/status"
    class: public-by-design
    justification: "NNMClub session boolean. Returns authenticated true/false only, never credential values (§11.4.10)."
    evidence: "download-proxy/src/api/auth.py:351"
  - service: merge-service-python
    method: POST
    path: "/api/v1/auth/qbittorrent"
    class: known-gap
    justification: "KNOWN GAP: accepts qBittorrent WebUI credentials and mutates the stored session. Unauthenticated on a LAN bind."
    evidence: "download-proxy/src/api/routes.py:926"
  - service: merge-service-python
    method: POST
    path: "/api/v1/auth/qbittorrent/logout"
    class: known-gap
    justification: "KNOWN GAP: destroys the stored qBittorrent session. Any LAN host can force a logout."
    evidence: "download-proxy/src/api/auth.py:545"
  - service: merge-service-python
    method: GET
    path: "/api/v1/auth/rutracker/captcha"
    class: known-gap
    justification: "KNOWN GAP: issues a CAPTCHA challenge and mutates the pending-challenge store. Any LAN host can exhaust it. Bounded by a TTLCache cap, not by auth."
    evidence: "download-proxy/src/api/auth.py:109"
  - service: merge-service-python
    method: POST
    path: "/api/v1/auth/rutracker/cookie-login"
