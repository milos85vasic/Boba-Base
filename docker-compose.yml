services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      # ── OPERATOR-OWNED WRITES (feature 002, FR-001/FR-002/FR-016) ──────────
      # PUID/PGID are 0, NOT 1000, and the 0 is load-bearing.
      #
      # This image boots as root to run its s6 init, then drops to the `abc`
      # user at PUID. Under ROOTLESS podman the host maps container uid N to
      # 100000+N-1, so PUID=1000 made every download land at host uid 100999 —
      # an identity the operator does not have, which is why ownership had to
      # be changed by hand after every download.
      #
      # Container uid 0 maps to the HOST OPERATOR (uid 1000), so PUID=0 makes
      # the application write files the operator owns. This grants NO host
      # privilege: "root" inside a rootless container IS the unprivileged host
      # user it was launched by. §11.4.161 rootless operation is preserved.
      #
      # The alternative (--userns=keep-id) was tried and REJECTED: it leaves
      # this image with no usable root and it HANGS with no output, measured
      # twice (research.md R3). PUID=0 was measured to work on this same image.
      - PUID=0
      - PGID=0
      - TZ=Europe/Moscow
      - WEBUI_PORT=7185
      - WEBUI_USERNAME=admin
      - WEBUI_PASSWORD=admin
      - RUTRACKER_USERNAME=${RUTRACKER_USERNAME}
      - RUTRACKER_PASSWORD=${RUTRACKER_PASSWORD}
      # Configurable outbound proxy for tracker-bound egress (qBittorrent's own
      # nova3 search subprocesses use urllib, which honors these natively).
      - BOBA_UPSTREAM_PROXY=${BOBA_UPSTREAM_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-127.0.0.1,localhost,qbittorrent,jackett,flaresolverr}
    volumes:
      - ./config:/config
      - ${QBITTORRENT_DATA_DIR:-/mnt/DATA}:/downloads
      - ./tmp:/shared-tmp
    network_mode: host
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7185/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      # ── OPERATOR-OWNED WRITES (feature 002, FR-001/FR-002/FR-016) ──────────
      # PUID/PGID are 0, NOT 1000, and the 0 is load-bearing.
      #
      # This image boots as root to run its s6 init, then drops to the `abc`
      # user at PUID. Under ROOTLESS podman the host maps container uid N to
      # 100000+N-1, so PUID=1000 made every download land at host uid 100999 —
      # an identity the operator does not have, which is why ownership had to
      # be changed by hand after every download.
      #
      # Container uid 0 maps to the HOST OPERATOR (uid 1000), so PUID=0 makes
      # the application write files the operator owns. This grants NO host
      # privilege: "root" inside a rootless container IS the unprivileged host
      # user it was launched by. §11.4.161 rootless operation is preserved.
      #
      # The alternative (--userns=keep-id) was tried and REJECTED: it leaves
      # this image with no usable root and it HANGS with no output, measured
      # twice (research.md R3). PUID=0 was measured to work on this same image.
      - PUID=0
      - PGID=0
      - TZ=Europe/Moscow
      - AUTO_UPDATE=true
    volumes:
      - ./config/jackett:/config
    network_mode: host
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 512
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9117/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qbittorrent-proxy-go:
    build:
      context: ./qBitTorrent-go
      dockerfile: Dockerfile
    container_name: qbittorrent-proxy-go
    environment:
      - QBITTORRENT_HOST=localhost
      - QBITTORRENT_PORT=7185
      - QBITTORRENT_URL=http://localhost:7185
      - QBITTORRENT_USER=${QBITTORRENT_USER:-admin}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS:-admin}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:-admin}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-admin}
      - MERGE_SERVICE_PORT=7187
      - MERGE_SERVICE_HOST=0.0.0.0
      - PROXY_PORT=7186
      - BRIDGE_PORT=7188
      - TMPDIR=/shared-tmp
      - RUTRACKER_USERNAME=${RUTRACKER_USERNAME}
      - RUTRACKER_PASSWORD=${RUTRACKER_PASSWORD}
      - KINOZAL_USERNAME=${KINOZAL_USERNAME}
      - KINOZAL_PASSWORD=${KINOZAL_PASSWORD}
      - NNMCLUB_COOKIES=${NNMCLUB_COOKIES}
      - RUTRACKER_COOKIES=${RUTRACKER_COOKIES}
      - IPTORRENTS_COOKIES=${IPTORRENTS_COOKIES:-}
      # RUTOR_COOKIES / KINOZAL_COOKIES — populated by
      # scripts/load-tracker-cookies.sh from ~/Downloads/cookies_<t>.txt
      # (operator mandate 2026-08-15). RuTor is public but the cookie
      # jar carries cf_clearance which helps with Cloudflare challenges;
      # Kinozal is auth-required and the cookie is the session token.
      # Empty-defaults keep `compose up` working on hosts where these
      # aren't set (§11.4.6 honest fallback).
      - RUTOR_COOKIES=${RUTOR_COOKIES:-}
      - KINOZAL_COOKIES=${KINOZAL_COOKIES:-}
      - NNMCLUB_USERNAME=${NNMCLUB_USERNAME}
      - NNMCLUB_PASSWORD=${NNMCLUB_PASSWORD}
      - IPTORRENTS_USERNAME=${IPTORRENTS_USERNAME}
      - IPTORRENTS_PASSWORD=${IPTORRENTS_PASSWORD}
      - MAX_CONCURRENT_SEARCHES=5
      - MAX_CONCURRENT_TRACKERS=10
      - PUBLIC_TRACKER_DEADLINE_SECONDS=15
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:7187,http://127.0.0.1:7187,http://localhost:4200,http://127.0.0.1:4200}
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      # Configurable outbound proxy for tracker-bound egress (internal/httpx).
      # Loopback + sidecar (qbittorrent, jackett) hosts are bypassed via NO_PROXY.
      - BOBA_UPSTREAM_PROXY=${BOBA_UPSTREAM_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-127.0.0.1,localhost,qbittorrent,jackett,flaresolverr}
    volumes:
      - ./config:/config
      - ./config/jackett:/jackett-config:ro
      - ${QBITTORRENT_DATA_DIR:-/mnt/DATA}:/downloads
      - ./tmp:/shared-tmp
    network_mode: host
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 512
    oom_score_adj: 500
    depends_on:
      qbittorrent:
        condition: service_healthy
      jackett:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7187/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - go

  download-proxy:
    image: python:3.12-alpine
    container_name: qbittorrent-proxy
    environment:
      - QBITTORRENT_HOST=localhost
      - QBITTORRENT_PORT=7185
      - QBITTORRENT_URL=http://localhost:7185
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=admin
      - PROXY_PORT=7186
      - MERGE_SERVICE_PORT=7187
      - TMPDIR=/shared-tmp
      - RUTRACKER_USERNAME=${RUTRACKER_USERNAME}
      - RUTRACKER_PASSWORD=${RUTRACKER_PASSWORD}
      - KINOZAL_USERNAME=${KINOZAL_USERNAME}
      - KINOZAL_PASSWORD=${KINOZAL_PASSWORD}
      - NNMCLUB_COOKIES=${NNMCLUB_COOKIES}
      - RUTRACKER_COOKIES=${RUTRACKER_COOKIES}
      - IPTORRENTS_COOKIES=${IPTORRENTS_COOKIES:-}
      # RUTOR_COOKIES / KINOZAL_COOKIES — populated by
      # scripts/load-tracker-cookies.sh from ~/Downloads/cookies_<t>.txt
      # (operator mandate 2026-08-15). RuTor is public but the cookie
      # jar carries cf_clearance which helps with Cloudflare challenges;
      # Kinozal is auth-required and the cookie is the session token.
      # Empty-defaults keep `compose up` working on hosts where these
      # aren't set (§11.4.6 honest fallback).
      - RUTOR_COOKIES=${RUTOR_COOKIES:-}
      - KINOZAL_COOKIES=${KINOZAL_COOKIES:-}
      - NNMCLUB_USERNAME=${NNMCLUB_USERNAME:-}
      - NNMCLUB_PASSWORD=${NNMCLUB_PASSWORD:-}
      - IPTORRENTS_USERNAME=${IPTORRENTS_USERNAME}
      - IPTORRENTS_PASSWORD=${IPTORRENTS_PASSWORD}
      # RuTor is public per CLAUDE.md (no login endpoint), but propagate
      # the vars for parity with the other trackers and for future-proof
      # readiness if RuTor ever ships an auth path. Empty-default keeps
      # `compose up` working on hosts where these are unset.
      - RUTOR_USERNAME=${RUTOR_USERNAME:-}
      - RUTOR_PASSWORD=${RUTOR_PASSWORD:-}
      - MAX_CONCURRENT_TRACKERS=10
      - PUBLIC_TRACKER_DEADLINE_SECONDS=15
      - ENABLE_DEAD_TRACKERS=${ENABLE_DEAD_TRACKERS:-0}
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:7187,http://127.0.0.1:7187,http://localhost:4200,http://127.0.0.1:4200}
      # RD2-22 (docs/GOVERNANCE_AUDIT_2026-08-08_ROUND2.md): optional shared-secret
      # gate for the mutating download/hooks/schedules/theme routes
      # (api/routes.py require_api_token). Unset/empty -> those routes stay
      # OPEN (§11.4.122 backward-compat default, unchanged). Set it here (or in
      # .env) to require Authorization: Bearer <token> / X-Boba-Token: <token>.
      - BOBA_API_TOKEN=${BOBA_API_TOKEN:-}
      # Configurable outbound proxy for tracker-bound egress (config/proxy.py:
      # apply_proxy_env maps BOBA_UPSTREAM_PROXY → HTTP(S)_PROXY/NO_PROXY for the
      # urllib plugin subprocesses + trust_env aiohttp tracker sessions).
      - BOBA_UPSTREAM_PROXY=${BOBA_UPSTREAM_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-127.0.0.1,localhost,qbittorrent,jackett,flaresolverr}
    volumes:
      - ./config:/config
      - ./config/jackett:/jackett-config:ro
      - ./download-proxy:/config/download-proxy
      - ./tmp:/shared-tmp
      - ./start-proxy.sh:/start-proxy.sh:ro
    working_dir: /config/qBittorrent/nova3/engines
    command: /start-proxy.sh
    network_mode: host
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 512
    oom_score_adj: 500
    depends_on:
      qbittorrent:
        condition: service_healthy
      jackett:
        condition: service_healthy
    healthcheck:
      # BOB-138: this container serves BOTH 7186 (download proxy) and 7187
      # (merge search) from a SINGLE process, so the check must probe BOTH.
      # It previously probed only 7186 -- and on 2026-08-20 the container
      # reported "Up 4 hours (healthy)" while 7187 had been returning nothing
      # for ~2 hours (7186 -> HTTP 200 in 0.096s, 7187 -> HTTP 000 after 6s).
      # A check covering a subset of served ports asserts a PROXY signal
      # instead of the real condition (§11.4.201), so the product's primary
      # capability can die invisibly.
      #
      # `python -c` rather than curl: curl is ABSENT from the python:3.12-alpine
      # image (verified in-container 2026-08-20), so the urllib probe is a
      # deliberate choice, not an oversight. urlopen raises on a non-2xx or a
      # timeout, so either port failing exits non-zero.
      #
      # Guarded by scripts/pre_build/check_cm_healthcheck_covers_served_ports.sh
      # against the declaration in config/served_ports.yaml.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:7186/', timeout=5); u.urlopen('http://localhost:7187/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # boba-jackett — Go service exposing the Jackett management API on :7189.
  # See docs/superpowers/specs/2026-04-27-jackett-management-ui-and-system-db-design.md §4.2.
  # Network host so it can reach Jackett on localhost:9117 and serve :7189
  # to the dashboard alongside the existing services.
  boba-jackett:
    build:
      context: ./qBitTorrent-go
      dockerfile: Dockerfile.jackett
    container_name: boba-jackett
    environment:
      - JACKETT_URL=http://localhost:9117
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - BOBA_MASTER_KEY=${BOBA_MASTER_KEY:-}
      - BOBA_DB_PATH=/config/boba.db
      - BOBA_ENV_PATH=/host-env/.env
      - PORT=7189
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:7187,http://127.0.0.1:7187,http://localhost:4200,http://127.0.0.1:4200}
    volumes:
      - ./config:/config                    # boba.db lives here
      - ./config/jackett:/jackett-config:ro
      - ./.env:/host-env/.env               # bind-mount for atomic mirror writes
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 256
    oom_score_adj: 500
    depends_on:
      jackett:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7189/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
