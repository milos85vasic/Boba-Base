open_findings:
  - id: X1
    severity: HIGH
    raised_at: phase-1-checkpoint
    title: probe_location asserts host-write ownership, not container-write ownership
    detail: >
      probe_location() reports "ok" for the download root, a directory owned by
      uid 100999 that still contains a 100999-owned item. It runs as the host
      user, so it creates a host-owned file and concludes the location is fine.
      The defect this feature exists to fix is that CONTAINER writes land at
      100999 - so the probe answers a different question than FR-010 asks.
      This is the exact proxy-vs-real-condition failure (§11.4.201) that
      FR-010b and the function's own docstring forbid.
    scope: T003 built what its task specified; the defect is in
      contracts/startup-precondition.md, which did not state WHOSE write must
      be probed.
    status: RESOLVED 2026-08-21 - operator approved option C (both probes,
      each reported for what it proves). contracts/startup-precondition.md
      amended; T033 must implement P1 + P2 with the honest-SKIP fallback.
    blocks: nothing - resolution recorded before Phase 2 proceeds
    options_for_operator:
      - Probe by running a throwaway container write (真 condition; needs the
        runtime up at precondition time, and costs seconds per start)
      - Probe host-write AND assert the per-service route from
        docker-compose.yml (cheap, but the route check is itself a proxy)
      - Both - container probe when the runtime is available, route assertion
        as the fallback, each reported honestly for what it proves
