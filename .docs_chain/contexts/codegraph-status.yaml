# Docs Chain context — CodeGraph Status ledger (§11.4.106 / §11.4.78 / §11.4.80)
#
# Added 2026-08-18 (BOB-075, GOVERNANCE_AUDIT_2026-08-08_ROUND2.md RD2-08):
# docs/codegraph/Status.md always had .html/.pdf/.docx siblings but was never
# wired into a docs_chain context, so `docs_chain verify --all` never covered
# it. Mirrors the schema of `.docs_chain/contexts/features-status.yaml`
# (confirmed against the same real vasic-digital/docs_chain engine).
#
# Model: Status.md (kind: status) is the authored source (an append-only
# ledger per constitution/scripts/codegraph_sync.sh). HTML/PDF/DOCX are
# derived exports, kept in sync via `docs_chain sync --all`.

context: codegraph-status
description: >
  CodeGraph install/update/sync/validate ledger for the Boba project
  (§11.4.78/§11.4.79/§11.4.80). Status.md is the authored source;
  HTML/PDF/DOCX are kept in sync as exports (§11.4.65 universal markdown
  export).

nodes:
  status_md:   { kind: status, path: docs/codegraph/Status.md }
  status_html: { kind: html,   path: docs/codegraph/Status.html }
  status_pdf:  { kind: pdf,    path: docs/codegraph/Status.pdf }
  status_docx: { kind: docx,   path: docs/codegraph/Status.docx }
  status_summary_md:   { kind: status_summary, path: docs/codegraph/Status_Summary.md }
  status_summary_html: { kind: html,           path: docs/codegraph/Status_Summary.html }
  status_summary_pdf:  { kind: pdf,            path: docs/codegraph/Status_Summary.pdf }
  status_summary_docx: { kind: docx,           path: docs/codegraph/Status_Summary.docx }

edges:
  - { type: derive-from, from: status_md,   to: status_html, transform: md2html }
  - { type: derive-from, from: status_html, to: status_pdf,  transform: html2pdf }
  - { type: derive-from, from: status_md,   to: status_docx, transform: md2docx }
  - { type: derive-from, from: status_summary_md,   to: status_summary_html, transform: md2html }
  - { type: derive-from, from: status_summary_html, to: status_summary_pdf,  transform: html2pdf }
  - { type: derive-from, from: status_summary_md,   to: status_summary_docx, transform: md2docx }

transforms:
  md2html:  { builtin: pandoc-html }
  html2pdf: { builtin: weasyprint-pdf }
  md2docx:  { builtin: pandoc-docx }
